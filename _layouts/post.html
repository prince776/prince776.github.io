---
layout: default
---
<article class="post">
  <header class="post-head">
    <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-desc">{{ page.description }}</p>{% endif %}
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <footer class="post-foot">
    <a href="/blog/">&larr; All posts</a>
    <a href="/feed.xml">Subscribe via RSS</a>
  </footer>
</article>
