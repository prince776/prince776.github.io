title: Prince Gupta
description: Software engineer. Writing about low-level systems, codebases, and building things from scratch.
url: https://prince776.github.io
author: Prince Gupta
twitter:
  username: codemastercppYT

permalink: /blog/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    default_lang: plaintext

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - serve.sh

# Long-form notes and writeups, linked from posts but not listed on the
# homepage, blog index, or RSS feed.
collections:
  scratchpad:
    output: true
    permalink: /scratchpad/:name/

defaults:
  - scope:
      type: scratchpad
    values:
      layout: post
      kicker: Scratchpad
